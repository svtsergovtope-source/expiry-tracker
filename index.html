<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Трекер сроков годности</title><script src="https://unpkg.com/@zxing/library@latest"></script><style>body{font:16px Arial;max-width:700px;margin:auto;padding:16px;background:#f8fafc;color:#222}input,button{padding:12px;margin:5px 0;border-radius:6px;border:1px solid #ccc}input{width:100%;box-sizing:border-box}button{background:#056b78;color:white;border:0;cursor:pointer}.row{display:flex;gap:8px}.row>*{flex:1}table{width:100%;margin-top:16px;border-collapse:collapse;background:white}td,th{padding:8px;border:1px solid #ddd;text-align:left}.ok{color:green}.warn{color:#b66a00}.bad{color:#b00020}#video{display:none;width:100%;max-height:60vh}small{color:#666}</style></head><body><h1>Трекер сроков годности</h1><p>Данные хранятся только в браузере этого устройства.</p><label>Код DataMatrix/товара</label><input id="code" placeholder="Введите код"><label>Срок годности</label><input id="date" type="date"><div class="row"><button id="add">Добавить</button><button id="scan">Сканировать</button></div><video id="video" playsinline></video><button id="stop" style="display:none">Остановить камеру</button><p id="msg"></p><hr><h2>Журнал (<span id="count">0</span>)</h2><label>Показать до даты</label><input id="filter" type="date"><div class="row"><button id="apply">Применить</button><button id="reset">Сбросить</button><button id="export">Экспорт CSV</button></div><button id="clear" style="background:#c62828">Очистить всё</button><table><thead><tr><th>Добавлено</th><th>Срок</th><th>Статус</th><th>Код</th><th></th></tr></thead><tbody id="log"></tbody></table><script>const $=id=>document.getElementById(id),code=$('code'),date=$('date'),video=$('video'),msg=$('msg');let stream,reader,timer;function expiryFromCode(s){let m=s.match(/\(17\)(\d{8})/);if(!m)m=s.match(/17(\d{6})/);if(!m)return null;let d=m[1],y=d.length==8?+d.slice(0,4):(+d.slice(0,2)<50?2000:1900)+ +d.slice(0,2),mo=d.length==8?+d.slice(4,6):+d.slice(2,4),day=d.length==8?+d.slice(6,8):+d.slice(4,6);return new Date(y,mo-1,day,23,59,59)}function logs(){return JSON.parse(localStorage.expiryLogs||'[]')}function status(d){if(!d)return['Неизвестен',''];let n=Math.ceil((new Date(d)-new Date())/864e5);return n<=0?['ПРОСРОЧЕНО','bad']:n<=7?['Истекает скоро','warn']:['В СРОКЕ','ok']}function render(){let a=logs(),f=$('filter').value,cut=f?new Date(f+'T23:59:59'):null;$('log').innerHTML='';let n=0;a.sort((x,y)=>(x.expiry||'9999').localeCompare(y.expiry||'9999')).forEach((x,i)=>{let d=x.expiry&&new Date(x.expiry);if(cut&&d&&d>cut)return;let s=status(x.expiry);$('log').innerHTML+=`<tr><td>${new Date(x.added).toLocaleDateString('ru-RU')}</td><td>${d?d.toLocaleDateString('ru-RU'):'-'}</td><td class="${s[1]}">${s[0]}</td><td><small>${x.code||'-'}</small></td><td><button onclick="del(${i})">Удалить</button></td></tr>`;n++});$('count').textContent=n}function del(i){let a=logs();a.splice(i,1);localStorage.expiryLogs=JSON.stringify(a);render()}$('add').onclick=()=>{let c=code.value.trim(),d=date.value?new Date(date.value+'T23:59:59'):expiryFromCode(c);if(!c&&!d)return alert('Введите код или дату');let a=logs();a.push({added:new Date().toISOString(),expiry:d?.toISOString()||null,code:c});localStorage.expiryLogs=JSON.stringify(a);code.value=date.value='';render()};$('apply').onclick=render;$('reset').onclick=()=>{$('filter').value='';render()};$('clear').onclick=()=>{if(confirm('Удалить все записи?')){localStorage.removeItem('expiryLogs');render()}};$('export').onclick=()=>{let csv='Добавлено;Срок;Статус;Код\n'+logs().map(x=>`${x.added};${x.expiry||'-'};${status(x.expiry)[0]};${x.code||'-'}`).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='expiry-log.csv';a.click()};$('scan').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});video.srcObject=stream;video.style.display='block';$('stop').style.display='block';await video.play();reader=new ZXing.BrowserMultiFormatReader();timer=setInterval(async()=>{try{let r=await reader.decodeFromVideoElement(video);if(r){code.value=r.text;let d=expiryFromCode(r.text);if(d)date.value=d.toISOString().slice(0,10);stop()}}catch(e){}},300)}catch(e){msg.textContent='Камера недоступна: '+e.message}};function stop(){clearInterval(timer);stream?.getTracks().forEach(x=>x.stop());video.style.display='none';$('stop').style.display='none'}$('stop').onclick=stop;render()</script></body></html>

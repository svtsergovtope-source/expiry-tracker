<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Трекер сроков годности</title>
<script src="https://unpkg.com/@zxing/library@0.21.3"></script>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;max-width:700px;margin:auto;padding:16px;background:#f8fafc;color:#222}h1,h2{color:#056b78}label{display:block;font-weight:bold;margin-top:12px}input{width:100%;padding:12px;margin:8px 0;border:1px solid #bbb;border-radius:8px;font-size:16px}.row{display:flex;gap:8px;margin:12px 0}.row button{flex:1}button{padding:12px;border:0;border-radius:8px;background:#087985;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}button.secondary{background:#687386}button.danger{background:#c62828}#message{display:none;padding:12px;border-radius:8px;margin:12px 0}#message.ok{display:block;background:#dcfce7;color:#166534}#message.err{display:block;background:#fee2e2;color:#991b1b}#scanBox{display:none;position:relative;margin:16px 0;background:#000;border-radius:8px;overflow:hidden}#video{display:block;width:100%;max-height:65vh;min-height:220px;object-fit:cover}#scanBox:after{content:"";position:absolute;left:15%;right:15%;top:20%;bottom:20%;border:3px solid #fff;border-radius:12px;pointer-events:none}table{width:100%;border-collapse:collapse;background:#fff;margin-top:16px}th,td{padding:9px;border:1px solid #ddd;text-align:left;font-size:14px}.ok{color:#16803c;font-weight:bold}.warn{color:#a15c00;font-weight:bold}.bad{color:#c62828;font-weight:bold}.empty{text-align:center;padding:24px;color:#888}small{word-break:break-all;color:#666}
</style>
</head>
<body>
<h1>📦 Трекер сроков годности</h1>
<p>Данные хранятся локально в браузере этого устройства.</p>
<div id="message"></div>
<label>Код товара (DataMatrix/QR)</label><input id="code" placeholder="Введите или отсканируйте код">
<label>Срок годности</label><input id="expiry" type="date">
<div class="row"><button id="add">➕ Добавить</button><button id="scan" class="secondary">📷 Сканировать</button></div>
<div id="scanBox"><video id="video" autoplay muted playsinline></video></div>
<button id="stop" class="danger" style="display:none;width:100%">Остановить камеру</button>
<hr><h2>📋 Журнал (<span id="count">0</span>)</h2>
<label>Показать товары до даты</label><input id="filter" type="date">
<div class="row"><button id="apply">Применить</button><button id="reset" class="secondary">Сбросить</button><button id="export" class="secondary">Экспорт CSV</button></div>
<button id="clear" class="danger" style="width:100%">Очистить всё</button>
<table><thead><tr><th>Добавлено</th><th>Срок</th><th>Статус</th><th>Код</th><th></th></tr></thead><tbody id="log"></tbody></table>
<script>
const $=id=>document.getElementById(id),code=$('code'),expiry=$('expiry'),video=$('video'),box=$('scanBox'),stopBtn=$('stop'),message=$('message');
let reader=null,stream=null,scanning=false;
function records(){try{return JSON.parse(localStorage.getItem('expiryLogs')||'[]')}catch{return[]}}
function save(a){localStorage.setItem('expiryLogs',JSON.stringify(a))}
function notice(text,type='ok'){message.textContent=text;message.className=type?' '+type:'';message.style.display=text?'block':'none'}
function parseDate(s){let m=s&&s.match(/\(17\)(\d{8})/);if(m){let d=m[1];return new Date(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6,8),23,59,59)}m=s&&s.match(/17(\d{6})/);if(m){let d=m[1],y=+d.slice(0,2);return new Date(y<50?2000+y:1900+y,+d.slice(2,4)-1,+d.slice(4,6),23,59,59)}return null}
function status(d){if(!d)return['Неизвестен',''];let n=Math.ceil((d-new Date())/86400000);return n<=0?['ПРОСРОЧЕНО','bad']:n<=7?['Истекает скоро','warn']:['В СРОКЕ','ok']}
function render(){let a=records(),cut=$('filter').value?new Date($('filter').value+'T23:59:59'):null;let visible=a.filter(x=>!cut||!x.expiry||new Date(x.expiry)<=cut).sort((x,y)=>(x.expiry||'9999').localeCompare(y.expiry||'9999'));$('log').innerHTML=visible.length?'':'<tr><td colspan="5" class="empty">Записей пока нет</td></tr>';visible.forEach(x=>{let d=x.expiry?new Date(x.expiry):null,s=status(d),tr=document.createElement('tr');tr.innerHTML='<td>'+new Date(x.added).toLocaleDateString('ru-RU')+'</td><td>'+(d?d.toLocaleDateString('ru-RU'):'-')+'</td><td class="'+s[1]+'">'+s[0]+'</td><td><small>'+(x.code||'-')+'</small></td><td><button data-id="'+x.id+'" class="danger del">X</button></td>';$('log').appendChild(tr)});$('count').textContent=visible.length}
$('log').onclick=e=>{if(e.target.classList.contains('del')){save(records().filter(x=>String(x.id)!==e.target.dataset.id));render()}};
$('add').onclick=()=>{let c=code.value.trim(),d=expiry.value?new Date(expiry.value+'T23:59:59'):parseDate(c);if(!c&&!d){notice('Введите код или дату','err');return}let a=records();a.push({id:Date.now(),added:new Date().toISOString(),expiry:d?d.toISOString():null,code:c});save(a);code.value='';expiry.value='';render();notice('Запись добавлена')};
$('apply').onclick=render;$('reset').onclick=()=>{$('filter').value='';render()};$('clear').onclick=()=>{if(confirm('Удалить все записи?')){save([]);render()}};
$('export').onclick=()=>{let a=records();if(!a.length){notice('Нет данных для экспорта','err');return}let csv='Добавлено;Срок;Статус;Код\n'+a.map(x=>{let d=x.expiry?new Date(x.expiry):null;return '"'+new Date(x.added).toLocaleString('ru-RU')+'";"'+(d?d.toLocaleDateString('ru-RU'):'-')+'";"'+status(d)[0]+'";"'+(x.code||'-')+'"'}).join('\n');let u=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'})),aEl=document.createElement('a');aEl.href=u;aEl.download='expiry-log.csv';aEl.click();URL.revokeObjectURL(u)};
async function startScan(){if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){notice('Камера доступна только по HTTPS в обычном браузере (Chrome/Safari), не во встроенном окне приложения.','err');return}stopScan(false);try{notice('Разрешите доступ к камере...');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;box.style.display='block';stopBtn.style.display='block';await new Promise(resolve=>{video.onloadedmetadata=resolve});await video.play();scanning=true;reader=new ZXing.BrowserMultiFormatReader();reader.decodeFromVideoDevice(null,video,(result,error)=>{if(!scanning||!result)return;code.value=result.getText();let d=parseDate(code.value);if(d)expiry.value=d.toISOString().slice(0,10);notice('Код распознан. Проверьте дату и нажмите «Добавить»');stopScan()})}catch(e){notice('Камера не запустилась: '+(e.name==='NotAllowedError'?'доступ запрещён браузером':e.message),'err');stopScan(false)}}
function stopScan(show=true){scanning=false;if(reader){try{reader.reset()}catch{}reader=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.pause();video.srcObject=null;box.style.display='none';stopBtn.style.display='none';if(show)notice('Камера остановлена')}
$('scan').onclick=startScan;stopBtn.onclick=()=>stopScan();window.addEventListener('pagehide',()=>stopScan(false));code.onkeydown=e=>{if(e.key==='Enter')$('add').click()};render();
</script>
</body></html>
